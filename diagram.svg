<svg width="900" height="720" viewBox="0 0 900 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <rect width="900" height="720" rx="16" fill="#0f172a"></rect>
  
  
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">T-Board Architecture</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">Modular • Type-safe • Reusable Widgets • i18n Ready</text>

  
  <rect x="40" y="100" width="820" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="60" y="130" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">app/</text>
  <text x="60" y="152" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="12">api/dashboards/{sales, analytics, ecommerce, finance}   •   [locale]/(pages)/{dashboards, ecommerce, jobs, blog}</text>

  
  <rect x="40" y="190" width="400" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="60" y="220" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">components/</text>
  <text x="60" y="245" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• dashboards/</text>
  <text x="60" y="265" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• layout/</text>
  <text x="60" y="285" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• providers/</text>
  <text x="60" y="305" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• ui/  (shadcn)</text>
  <text x="60" y="325" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• widgets/  ← Reusable</text>

  
  <rect x="460" y="190" width="400" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="480" y="220" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">modules/dashboards/</text>
  <text x="480" y="245" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• sales/</text>
  <text x="480" y="265" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• analytics/</text>
  <text x="480" y="285" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• ecommerce/</text>
  <text x="480" y="305" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">• finance/</text>
  <text x="480" y="325" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">(data + config + translations)</text>

  
  <rect x="40" y="360" width="260" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="60" y="390" fill="#f472b6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">types/</text>
  <text x="60" y="415" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">dashboards/</text>
  <text x="60" y="435" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Typed API models</text>
  <text x="60" y="455" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">&amp; widget configs</text>

  <rect x="320" y="360" width="260" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="340" y="390" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">hooks/ + lib/</text>
  <text x="340" y="415" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">TanStack Query hooks</text>
  <text x="340" y="435" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">API clients</text>
  <text x="340" y="455" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">utils &amp; formatters</text>

  <rect x="600" y="360" width="260" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="620" y="390" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">i18n/</text>
  <text x="620" y="415" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">en / fa</text>
  <text x="620" y="435" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">RTL ↔ LTR</text>
  <text x="620" y="455" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11">Locale routing</text>

  
  <rect x="40" y="500" width="820" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"></rect>
  <text x="60" y="530" fill="#22d3ee" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Data Flow</text>
  <text x="60" y="555" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="13">API Route  →  API Client  →  Query Hook  →  Dashboard Module  →  Reusable Widget</text>
  <text x="60" y="575" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">Mock contracts designed for easy real-backend swap</text>

  
  <text x="450" y="640" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12">Next.js  •  TypeScript  •  Tailwind  •  shadcn/ui  •  TanStack Query  •  Recharts  •  i18next</text>
  <text x="450" y="665" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="11">Reusable Widgets  •  Theme System  •  Light/Dark  •  Responsive</text>
  <text x="450" y="695" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="11">Portfolio Project by Farid Teymouri</text>
</svg>
